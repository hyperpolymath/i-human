name: OSSF Scorecard
on:
  push:
    branches: [main, master]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

on:
  branch_protection_rule:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  id-token: write
  actions: read

jobs:
  analysis:
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@5b1d00229e5e8c0c0fbfedc7e80f37ea50f49236
    permissions:
      contents: read
      security-events: write
      id-token: write
    secrets: inherit
